name: Birthday Bot

on:
  schedule:
    - cron: '30 1 * * *'
  workflow_dispatch:

jobs:
  send-birthday:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Send Birthday Greeting
        run: |
          birthdays=$(cat birthdays.json)
          bj_month=$(TZ=Asia/Shanghai date +%m | sed 's/^0//')
          bj_day=$(TZ=Asia/Shanghai date +%d | sed 's/^0//')
          echo "Today (Beijing): $bj_month/$bj_day"

          echo "$birthdays" | jq -c '.[]' | while read person; do
            p_month=$(echo "$person" | jq '.month')
            p_day=$(echo "$person" | jq '.day')
            p_name=$(echo "$person" | jq -r '.name')

            if [ "$p_month" = "$bj_month" ] && [ "$p_day" = "$bj_day" ]; then
              echo "🎉 $p_name's birthday!"
              encoded_name=$(python3 -c "import urllib.parse; print(urllib.parse.quote('$p_name'))")
              card_url="https://hhsssaa65-cyber.github.io/birthday-card/?name=${encoded_name}"

              curl -s -X POST "https://open.feishu.cn/open-apis/bot/v2/hook/876dea28-e94d-495b-9123-9df2f845f6ec" \
                -H "Content-Type: application/json" \
                -d "{
                  \"msg_type\": \"interactive\",
                  \"card\": {
                    \"header\": {
                      \"title\": {\"tag\": \"plain_text\", \"content\": \"🎂 ${p_name}，生日快乐！\"},
                      \"template\": \"red\"
                    },
                    \"elements\": [
                      {\"tag\": \"markdown\", \"content\": \"**${p_name}**，祝你生日快乐！🎉\n\n愿你的每一天都充满阳光与欢笑，愿所有美好都如期而至！\"},
                      {\"tag\": \"hr\"},
                      {\"tag\": \"action\", \"actions\": [{\"tag\": \"button\", \"text\": {\"tag\": \"plain_text\", \"content\": \"🎁 打开生日贺卡\"}, \"url\": \"${card_url}\", \"type\": \"primary\"}]}
                    ]
                  }
                }"
              echo "✅ Sent to $p_name"
            fi
          done
